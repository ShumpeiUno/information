name: Delete this repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/delete-repository.yml"

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Request repository deletion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}"
